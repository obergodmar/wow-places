name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: cachix/install-nix-action@v31.11.1
            - uses: cachix/cachix-action@v17
              with:
                  name: devenv
            - run: nix profile add github:cachix/devenv/v2.3.1
            - run: devenv shell -- pnpm install --frozen-lockfile
            - run: devenv shell -- wow-check
            - run: devenv shell -- wow-test-coverage
            - run: devenv shell -- wow-build
            - run: devenv shell -- wow-test-e2e
